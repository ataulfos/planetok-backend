services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskai}
      POSTGRES_USER: ${POSTGRES_USER:-taskai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskai} -d ${POSTGRES_DB:-taskai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskai}
      POSTGRES_USER: ${POSTGRES_USER:-taskai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskai}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "3001:8000"
    volumes:
      - ./:/app

volumes:
  postgres_data:
